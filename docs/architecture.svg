<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 970" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>

    <!-- Filters & Gradients -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .node-title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .node-sub { font-size: 11px; fill: #8b949e; }
    .badge-text { font-size: 12px; font-weight: 600; fill: #58a6ff; }
    .conn { fill: none; stroke: #58a6ff; stroke-width: 1.75; }
    .conn-err { fill: none; stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.75; }
  </style>

  <!-- Background Border Container -->
  <rect x="10" y="10" width="860" height="950" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Title Header -->
  <text x="440" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">News Briefing — LightDAG Pipeline</text>

  <!-- ==================== CONNECTORS (Rendered Behind Nodes) ==================== -->
  
  <!-- categories -> FetchNews -->
  <path d="M 320 103 L 250 103 L 250 130" class="conn" marker-end="url(#arrow)" />
  <!-- categories -> HistoryNews -->
  <path d="M 460 103 L 530 103 L 530 130" class="conn" marker-end="url(#arrow)" />

  <!-- FetchNews -> DedupeNews -->
  <path d="M 250 178 L 250 190 L 350 190 L 350 205" class="conn" marker-end="url(#arrow)" />

  <!-- HistoryNews -> DedupeNews -->
  <path d="M 530 178 L 530 190 L 430 190 L 430 205" class="conn" marker-end="url(#arrow)" />

  <!-- DedupeNews -> TruncateNews (pre-read) -->
  <path d="M 390 253 L 390 275" class="conn" marker-end="url(#arrow)" />

  <!-- TruncateNews (pre-read) -> ReadNews -->
  <path d="M 390 323 L 390 345" class="conn" marker-end="url(#arrow)" />

  <!-- ReadNews -> FilterRecency (post-read) -->
  <path d="M 390 393 L 390 415" class="conn" marker-end="url(#arrow)" />

  <!-- FilterRecency (post-read) -> SummarizeNews -->
  <path d="M 390 463 L 390 485" class="conn" marker-end="url(#arrow)" />

  <!-- SummarizeNews -> TruncateByCategory (post-summarize) -->
  <path d="M 390 533 L 390 555" class="conn" marker-end="url(#arrow)" />

  <!-- TruncateByCategory (post-summarize) -> FormatNews -->
  <path d="M 350 603 L 350 616 L 250 616 L 250 630" class="conn" marker-end="url(#arrow)" />

  <!-- TruncateByCategory (post-summarize) -> SaveNews -->
  <path d="M 430 603 L 430 616 L 530 616 L 530 630" class="conn" marker-end="url(#arrow)" />

  <!-- FormatNews -> SendNews -->
  <path d="M 250 678 L 250 705" class="conn" marker-end="url(#arrow)" />

  <!-- channels -> SendNews -->
  <path d="M 120 726 L 140 726" class="conn" marker-end="url(#arrow)" />

  <!-- SendNews -> MergeStatus -->
  <path d="M 250 753 L 250 768 L 350 768 L 350 780" class="conn" marker-end="url(#arrow)" />

  <!-- SaveNews -> MergeStatus -->
  <path d="M 530 678 L 530 768 L 430 768 L 430 780" class="conn" marker-end="url(#arrow)" />

  <!-- MergeStatus -> Success -->
  <path d="M 390 828 L 390 855" class="conn" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-success)" />

  <!-- Error Connections to ErrorOperator -->
  <path d="M 360 154 C 620 154, 620 485, 680 485" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 640 154 C 660 154, 660 485, 680 485" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 500 229 C 600 229, 620 495, 680 495" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 500 299 C 590 299, 615 505, 680 505" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 500 369 C 580 369, 610 515, 680 515" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 500 439 C 580 439, 610 525, 680 525" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 500 509 C 580 509, 610 535, 680 535" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 500 579 C 590 579, 615 545, 680 545" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 640 654 C 660 654, 660 555, 680 555" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 360 729 C 620 729, 620 555, 680 555" class="conn-err" marker-end="url(#arrow-error)" />

  <!-- ErrorOperator -> Failure Output -->
  <path d="M 765 543 L 765 570" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#arrow-error)" />

  <!-- ==================== NODES ==================== -->

  <!-- Top Input: Categories -->
  <g filter="url(#shadow)">
    <rect x="320" y="82" width="140" height="42" rx="21" fill="#161b22" stroke="#388bfd" stroke-width="2" />
    <text x="390" y="108" text-anchor="middle" class="badge-text">🏷️ categories</text>
  </g>

  <!-- Level 1: FetchNews & HistoryNews -->
  <g filter="url(#shadow)">
    <rect x="140" y="130" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="250" y="152" text-anchor="middle" class="node-title">🌐 FetchNewsOperator</text>
    <text x="250" y="168" text-anchor="middle" class="node-sub">Piscina Worker Threads</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="130" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="530" y="152" text-anchor="middle" class="node-title">🗄️ HistoryNewsOperator</text>
    <text x="530" y="168" text-anchor="middle" class="node-sub">Query PostgreSQL</text>
  </g>

  <!-- Level 2: DedupeNews -->
  <g filter="url(#shadow)">
    <rect x="280" y="205" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="390" y="227" text-anchor="middle" class="node-title">🧠 DedupeNewsOperator</text>
    <text x="390" y="243" text-anchor="middle" class="node-sub">Exact ID + AI Event Match</text>
  </g>

  <!-- Level 3: TruncateNews (pre-read) -->
  <g filter="url(#shadow)">
    <rect x="280" y="275" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="390" y="297" text-anchor="middle" class="node-title">✂️ TruncateNewsOperator</text>
    <text x="390" y="313" text-anchor="middle" class="node-sub">pre_read_truncate_news</text>
  </g>

  <!-- Level 4: ReadNews -->
  <g filter="url(#shadow)">
    <rect x="280" y="345" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="390" y="367" text-anchor="middle" class="node-title">📖 ReadNewsOperator</text>
    <text x="390" y="383" text-anchor="middle" class="node-sub">Piscina Worker Threads</text>
  </g>

  <!-- Level 5: FilterRecency (post-read) -->
  <g filter="url(#shadow)">
    <rect x="280" y="415" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="390" y="437" text-anchor="middle" class="node-title">⏱️ FilterRecencyOperator</text>
    <text x="390" y="453" text-anchor="middle" class="node-sub">post_read_filtered_recency</text>
  </g>

  <!-- Level 6: SummarizeNews -->
  <g filter="url(#shadow)">
    <rect x="280" y="485" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="390" y="507" text-anchor="middle" class="node-title">✨ SummarizeNewsOperator</text>
    <text x="390" y="523" text-anchor="middle" class="node-sub">LLM Headlines &amp; Bullets</text>
  </g>

  <!-- Level 7: TruncateByCategory (post-summarize) -->
  <g filter="url(#shadow)">
    <rect x="270" y="555" width="240" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="390" y="577" text-anchor="middle" class="node-title">✂️ TruncateByCategoryOperator</text>
    <text x="390" y="593" text-anchor="middle" class="node-sub">truncate_by_cat</text>
  </g>

  <!-- Level 8: FormatNews & SaveNews -->
  <g filter="url(#shadow)">
    <rect x="140" y="630" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="250" y="652" text-anchor="middle" class="node-title">📝 FormatNewsOperator</text>
    <text x="250" y="668" text-anchor="middle" class="node-sub">Telegram MarkdownV2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="630" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="530" y="652" text-anchor="middle" class="node-title">💾 SaveNewsOperator</text>
    <text x="530" y="668" text-anchor="middle" class="node-sub">Persist to PostgreSQL</text>
  </g>

  <!-- Level 9: SendNews & Channels Input -->
  <g filter="url(#shadow)">
    <rect x="20" y="705" width="100" height="42" rx="21" fill="#161b22" stroke="#388bfd" stroke-width="2" />
    <text x="70" y="731" text-anchor="middle" class="badge-text">📢 channels</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="140" y="705" width="220" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="250" y="727" text-anchor="middle" class="node-title">📢 SendNewsOperator</text>
    <text x="250" y="743" text-anchor="middle" class="node-sub">Broadcast to Telegram</text>
  </g>

  <!-- Level 10: MergeStatus -->
  <g filter="url(#shadow)">
    <rect x="280" y="780" width="220" height="48" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5" />
    <text x="390" y="802" text-anchor="middle" class="node-title" fill="#f0e6c8">🔄 MergeStatusOperator</text>
    <text x="390" y="818" text-anchor="middle" class="node-sub">Wait for [sent, saved]</text>
  </g>

  <!-- Level 11: Terminal Success -->
  <g filter="url(#shadow)">
    <rect x="290" y="855" width="200" height="44" rx="22" fill="#1b4728" stroke="#3fb950" stroke-width="2" />
    <text x="390" y="882" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">✅ success = true</text>
  </g>

  <!-- Error Handling Node -->
  <g filter="url(#shadow)">
    <rect x="680" y="475" width="170" height="68" rx="8" fill="#381a1e" stroke="#f85149" stroke-width="1.5" />
    <text x="765" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">🚨 ErrorOperator</text>
    <text x="765" y="516" text-anchor="middle" font-size="11" fill="#e6edf3">Catch &amp; Alert Channels</text>
    <text x="765" y="530" text-anchor="middle" font-size="10" fill="#8b949e">In: [err_code, err_obj]</text>
  </g>

  <!-- Terminal Failure -->
  <g filter="url(#shadow)">
    <rect x="680" y="570" width="170" height="44" rx="22" fill="#381a1e" stroke="#f85149" stroke-width="2" />
    <text x="765" y="597" text-anchor="middle" font-size="14" font-weight="700" fill="#f85149">❌ success = false</text>
  </g>

</svg>
