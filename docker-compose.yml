services:
  news_briefing:
    build: .
    container_name: news_briefing
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./cache:/app/.cache
    depends_on:
      - news_db

  news_db:
    image: postgres:18
    container_name: news_db
    volumes:
      - ./data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/my_init.sql:ro
    environment:
      POSTGRES_USER: ${database_user}
      POSTGRES_PASSWORD: ${database_password}
      POSTGRES_DB: ${database_name}
    restart: unless-stopped
    ports:
      - "9432:5432"
